# GhostLap local stack: Postgres + Redis + both services + Prometheus + Grafana.
#   cd infra
#   docker compose up --build
# Values like ${JWT_SECRET} come from infra/.env (copy .env.example first).
#
#   player-service  http://localhost:8081/swagger-ui.html
#   race-service    http://localhost:8082/swagger-ui.html
#   Prometheus      http://localhost:9090
#   Grafana         http://localhost:3000  (dashboard "GhostLap Overview", no login needed to view)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      # Read by the init script to create the per-service logins.
      PLAYERS_DB_PASSWORD: ${PLAYERS_DB_PASSWORD:?set PLAYERS_DB_PASSWORD in infra/.env}
      RACE_DB_PASSWORD: ${RACE_DB_PASSWORD:?set RACE_DB_PASSWORD in infra/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Host port 5433, because 5432 is often taken by a locally installed Postgres.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  player-service:
    build:
      context: ..                                   # repo root (see the Dockerfile)
      dockerfile: services/player-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/players
      DB_USERNAME: players_app
      DB_PASSWORD: ${PLAYERS_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in infra/.env}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  race-service:
    build:
      context: ..                                   # repo root: the build needs shared/ghost-format too
      dockerfile: services/race-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/race
      DB_USERNAME: race_app
      DB_PASSWORD: ${RACE_DB_PASSWORD}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Observability: Prometheus scrapes the services' metrics, Grafana draws them.
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"     # http://localhost:9090 (query UI, Status -> Targets)
    depends_on:
      - player-service
      - race-service

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in infra/.env}
      # Anyone on this machine can view dashboards without logging in; editing needs the admin login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ghostlap.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"     # http://localhost:3000
    depends_on:
      - prometheus

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
