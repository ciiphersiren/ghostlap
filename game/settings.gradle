rootProject.name = 'ghostlap-game'

// Composite build: use shared/ghost-format straight from source instead of a published jar.
// Any dependency on com.ghostlap:ghost-format is replaced by that project.
includeBuild '../shared/ghost-format'

// cheater: a command-line "hacked client" that submits fake laps, to exercise the anti-cheat metrics.
include 'core', 'lwjgl3', 'cheater'
