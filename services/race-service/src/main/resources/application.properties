spring.application.name=race-service
server.port=8082

# Database. docker-compose sets these env vars; the defaults point at the infra/ Postgres from the host.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/race}
spring.datasource.username=${DB_USERNAME:race_app}
spring.datasource.password=${DB_PASSWORD:}
# Flyway owns the schema. Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT. Same secret as player-service; no default on purpose, so a missing secret stops startup.
ghostlap.jwt.secret=${JWT_SECRET}
ghostlap.jwt.issuer=ghostlap

management.endpoints.web.exposure.include=health,prometheus
