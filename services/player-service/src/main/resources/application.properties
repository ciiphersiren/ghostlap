spring.application.name=player-service
server.port=8081

# Database. docker-compose sets these env vars; the defaults point at the infra/ Postgres from the host.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/players}
spring.datasource.username=${DB_USERNAME:players_app}
spring.datasource.password=${DB_PASSWORD:}
# Flyway owns the schema. Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT. JWT_SECRET has no default on purpose: the service refuses to start without it.
ghostlap.jwt.secret=${JWT_SECRET}
ghostlap.jwt.issuer=ghostlap
ghostlap.jwt.ttl=24h

management.endpoints.web.exposure.include=health,prometheus
